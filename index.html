<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>よみあげ書庫</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff; --fg: #1a202c; --muted: #718096; --line: #e2e8f0;
    --accent: #2b6cb0; --card: #f7fafc;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --fg: #edf2f7; --muted: #a0aec0; --line: #2d3748; --card: #1e232b; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, "Hiragino Sans", sans-serif; }
  main { max-width: 560px; margin-inline: auto; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); min-height: 100vh; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 0; position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .bar h1 { font-size: 20px; margin: 0; }
  .bartitle { font-size: 14px; color: var(--muted); flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn { font-size: 20px; background: none; border: none; color: var(--fg); padding: 8px; cursor: pointer; }
  button { font-family: inherit; cursor: pointer; }

  #bookGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
  .card { position: relative; }
  .cover { width: 100%; aspect-ratio: 2/2.9; object-fit: cover; border-radius: 8px; background: var(--card); display: block; }
  div.cover.ph, .ph { display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; }
  .prog { height: 3px; background: var(--line); border-radius: 2px; margin-top: 6px; }
  .progfill { height: 100%; background: var(--accent); border-radius: 2px; }
  .btitle { font-size: 13px; font-weight: 600; margin-top: 6px; line-height: 1.4; }
  .bmeta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .delbtn { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; border: none; background: rgba(0,0,0,.55); color: #fff; font-size: 14px; line-height: 1; }
  .import { display: flex; align-items: center; justify-content: center; margin-top: 20px; padding: 16px; border: 2px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 15px; cursor: pointer; }
  #emptyHint { text-align: center; color: var(--muted); font-size: 14px; margin-top: 40px; line-height: 1.8; }

  #playerView { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  #pCover { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 8px 0; }
  #pCover img { max-height: 100%; max-width: 50%; border-radius: 10px; }
  #pCover .ph { width: 40%; aspect-ratio: 2/2.9; font-size: 15px; }
  #pChapterTitle { text-align: center; font-size: 16px; font-weight: 600; margin-top: 8px; }
  #pChunkText { text-align: center; font-size: 16px; color: var(--fg); line-height: 1.75; min-height: 7em; margin: 8px 0; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .seekwrap { margin: 4px 0; }
  #seek { width: 100%; accent-color: var(--accent); }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .controls { display: flex; align-items: center; justify-content: space-around; margin: 10px 0; }
  .controls button { background: none; border: none; color: var(--fg); font-size: 24px; padding: 10px; }
  .controls .big { width: 68px; height: 68px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 26px; }
  .subcontrols { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; }
  .subcontrols button { background: none; border: 1px solid var(--line); border-radius: 16px; color: var(--fg); font-size: 13px; padding: 6px 12px; white-space: nowrap; }
  .ctllabel { font-size: 10px; color: var(--muted); display: block; text-align: center; }

  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; }
  .sheetbody { background: var(--bg); width: 100%; max-width: 560px; margin-inline: auto; border-radius: 16px 16px 0 0; max-height: 75vh; display: flex; flex-direction: column; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheethead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .sheethead h2 { font-size: 16px; margin: 0; }
  #chapterList { overflow-y: auto; }
  .chrow { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--line); color: var(--fg); font-size: 14px; padding: 13px 4px; }
  .chrow.current { color: var(--accent); font-weight: 600; }
  .chname { flex: 1; }
  .chtime { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .field { margin: 14px 0; font-size: 14px; }
  .field input[type="text"], .field select { width: 100%; font-size: 16px; padding: 10px; margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); }
  .info { font-size: 13px; color: var(--muted); margin: 6px 0; }
  .secondary { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: none; color: var(--fg); font-size: 15px; margin-top: 8px; }

  .presets { display: flex; gap: 10px; justify-content: center; margin: 16px 0 6px; }
  .presets button { border: 1px solid var(--line); background: none; color: var(--fg); border-radius: 16px; padding: 7px 16px; font-size: 14px; }
  .bmrow { display: flex; align-items: center; gap: 8px; width: 100%; border-bottom: 1px solid var(--line); padding: 11px 2px; }
  .bmmain { flex: 1; text-align: left; background: none; border: none; color: var(--fg); padding: 0; min-width: 0; }
  .bmch { font-size: 13px; font-weight: 600; }
  .bmsnip { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .bmdate { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .bmdel { background: none; border: none; color: var(--muted); font-size: 16px; padding: 6px; }
  #busy { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; display: flex; align-items: center; justify-content: center; }
  #busyMsg { background: var(--bg); color: var(--fg); padding: 18px 24px; border-radius: 12px; font-size: 14px; max-width: 80%; }
  #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom)); background: #2d3748; color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 13px; max-width: 90%; z-index: 40; line-height: 1.6; }
</style>
</head>
<body>

<main id="libraryView">
  <header class="bar">
    <h1>ライブラリ</h1>
    <button class="iconbtn" id="settingsBtn" aria-label="設定">⚙︎</button>
  </header>
  <div id="bookGrid"></div>
  <p id="emptyHint" hidden>まだ本がありません。<br>下のボタンからEPUBファイルを追加してください。</p>
  <label class="import">＋ EPUBを追加
    <input type="file" id="fileInput" accept=".epub,application/epub+zip" hidden>
  </label>
</main>

<main id="playerView" hidden>
  <header class="bar">
    <button class="iconbtn" id="backBtn" aria-label="ライブラリへ戻る">←</button>
    <div class="bartitle" id="pBookTitle"></div>
    <button class="iconbtn" id="pSettingsBtn" aria-label="設定">⚙︎</button>
  </header>
  <div id="pCover"></div>
  <div id="pChapterTitle"></div>
  <div id="pChunkText"></div>
  <div class="seekwrap">
    <input type="range" id="seek" min="0" max="0" value="0" step="1">
    <div class="times"><span id="tCur">0:00</span><span id="tTotal">0:00</span></div>
  </div>
  <div class="controls">
    <button id="prevChapBtn" aria-label="前の章">⏮︎<span class="ctllabel">章</span></button>
    <button id="prevBtn" aria-label="前の文">«<span class="ctllabel">文</span></button>
    <button id="playBtn" class="big" aria-label="再生/停止">▶︎</button>
    <button id="nextBtn" aria-label="次の文">»<span class="ctllabel">文</span></button>
    <button id="nextChapBtn" aria-label="次の章">⏭︎<span class="ctllabel">章</span></button>
  </div>
  <div class="subcontrols">
    <button id="rateBtn">1.0x</button>
    <button id="bmAddQuickBtn">＋しおり</button>
    <button id="bmListBtn">しおり一覧</button>
    <button id="tocBtn">目次</button>
  </div>
</main>

<div class="sheet" id="rateSheet" hidden>
  <div class="sheetbody">
    <div class="sheethead"><h2>再生速度</h2><button class="iconbtn" id="rateClose">×</button></div>
    <div id="rateVal" style="text-align:center; font-size:30px; font-weight:700; margin:4px 0 10px;">1.0x</div>
    <input type="range" id="rateSlider" min="0.5" max="3" step="0.1" value="1" style="width:100%; accent-color:var(--accent);">
    <div class="times"><span>0.5x</span><span>3.0x</span></div>
    <div class="presets">
      <button data-rate="1">1.0x</button>
      <button data-rate="1.2">1.2x</button>
      <button data-rate="1.5">1.5x</button>
      <button data-rate="2">2.0x</button>
    </div>
  </div>
</div>

<div class="sheet" id="bmSheet" hidden>
  <div class="sheetbody">
    <div class="sheethead"><h2>しおり一覧</h2><button class="iconbtn" id="bmClose">×</button></div>
    <p class="info" id="bmEmpty" hidden>しおりはまだありません。プレイヤーの「＋しおり」で現在位置を保存できます。</p>
    <div id="bmList" style="overflow-y:auto; margin-top:6px;"></div>
  </div>
</div>

<div class="sheet" id="chapterSheet" hidden>
  <div class="sheetbody">
    <div class="sheethead"><h2>目次</h2><button class="iconbtn" id="chapterClose">×</button></div>
    <div id="chapterList"></div>
  </div>
</div>

<div class="sheet" id="settingsSheet" hidden>
  <div class="sheetbody">
    <div class="sheethead"><h2>設定</h2><button class="iconbtn" id="settingsClose">×</button></div>
    <div style="overflow-y:auto">
      <label class="field">VOICEVOX APIキー
        <input type="text" id="keyInput" placeholder="P_xxxxxx" autocomplete="off">
      </label>
      <p class="info" id="pointsInfo"></p>
      <label class="field">読み上げ話者（変更後の合成から適用）
        <select id="speakerSel"><option value="3">ずんだもん（ノーマル）</option></select>
      </label>
      <p class="info" id="cacheInfo"></p>
      <button class="secondary" id="cacheClearBtn">音声キャッシュを削除</button>
      <p class="info">APIキーはこの端末内にのみ保存されます。キーは <a href="https://voicevox.su-shiki.com/su-shikiapis/" target="_blank" rel="noopener">su-shiki.com</a> で取得できます。</p>
    </div>
  </div>
</div>

<div id="busy" hidden><div id="busyMsg"></div></div>
<div id="toast" hidden></div>

<audio id="audio" preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
